[project]
name = "langchain-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Refone on Mac", email = "710196926@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepseek>=1.0.0",
    "exceptiongroup>=1.3.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langchain-openrouter>=0.2.8",
    "markdown>=3.10.3",
    "python-docx>=1.2.0",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "unstructured>=0.27.6",
]

[project.scripts]
langchain-learn = "langchain_learn:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
